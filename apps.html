<!DOCTYPE html>
<html lang="pl" data-lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function(){
      try {
        var lang = localStorage.getItem('ibron_lang');
        if(!lang) {
          var browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase().slice(0,2);
          lang = (browserLang === 'pl') ? 'pl' : 'en';
        }
        document.documentElement.setAttribute('data-lang', lang);
        document.documentElement.lang = lang;
      } catch(e) {
        document.documentElement.setAttribute('data-lang', 'pl');
        document.documentElement.lang = 'pl';
      }
    })();
  </script>
  
  <title>IBRON INDUSTRIES | Aplikacje</title>
  <meta name="description" content="Ekosystem oprogramowania Ibron Industries. Architektura Zero-Data, offline-first.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* ===== DESIGN SYSTEM & VARIABLES ===== */
    :root {
      --font-main: 'Poppins', sans-serif;
      
      --c-text-main: #FFF8F0;
      --c-text-muted: rgba(255, 248, 240, 0.75);
      
      --c-accent: #E8B84B; 
      
      /* Kolor poświaty dla telefonu - dopasowany do videoch.mp4 */
      --c-rim-light: rgba(41, 121, 255, 0.35); 
      
      --header-height: 90px;
    }

    /* ===== CSS LANGUAGE TOGGLE ===== */
    [data-lang="en"] .lang-pl { display: none !important; }
    [data-lang="pl"] .lang-en { display: none !important; }

    /* ===== RESET & GLOBAL ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { 
      scroll-behavior: smooth; 
    }
    
    body {
      color: var(--c-text-main);
      font-family: var(--font-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #050505; 
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
    button { border: none; background: none; font-family: inherit; cursor: pointer; }
    ul { list-style: none; }

    /* ===== BACKGROUND VIDEO & OVERLAY ===== */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* Ciemny overlay (0.65) zabezpieczający czytelność opisów na tle świecących obwodów */
      background: rgba(0, 0, 0, 0.65); 
      z-index: -1;
      pointer-events: none;
    }

    /* ===== TYPOGRAPHY ===== */
    h1, h2, h3, h4 { 
      font-weight: 800; 
      line-height: 1.15; 
      letter-spacing: -0.01em; 
      margin-bottom: 0.5em;
    }
    p { margin-bottom: 1.25em; font-weight: 400; }
    strong { font-weight: 600; color: #FFF; }

    /* ===== HEADER ===== */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-height);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      z-index: 1000;
      transition: background 0.4s ease, backdrop-filter 0.4s ease, border-bottom 0.4s ease;
      border-bottom: 1px solid transparent;
    }
    
    .header.scrolled {
      background: rgba(10, 10, 15, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      color: #FFF;
      text-transform: uppercase;
    }

    .nav-container { display: flex; align-items: center; gap: 40px; }
    .nav-links { display: flex; gap: 32px; }

    .nav-link {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--c-text-muted);
      position: relative;
    }

    .nav-link:hover { color: #FFF; }
    
    .nav-link.active {
      color: #FFF;
      font-weight: 600;
    }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 100%; height: 2px;
      background: var(--c-accent);
      border-radius: 2px;
    }

    .lang-switcher { 
      display: flex; gap: 12px; 
      border-left: 1px solid rgba(255, 255, 255, 0.2); 
      padding-left: 32px;
    }
    .lang-btn { color: var(--c-text-muted); font-weight: 600; font-size: 0.9rem; transition: color 0.2s ease; }
    .lang-btn:hover { color: #FFF; }
    .lang-btn.active { color: var(--c-accent); }

    /* ===== BUTTONS ===== */
    .action-buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px; 
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .btn-primary {
      background: #FFF;
      color: #000;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(255, 255, 255, 0.25);
      background: var(--c-text-muted);
      color: #000;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-3px);
    }

    /* ===== BADGE ===== */
    .badge-accent {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--c-accent);
      background: rgba(232, 184, 75, 0.1);
      border: 1px solid rgba(232, 184, 75, 0.25);
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 24px;
    }

    /* ===== LAYOUT & VIEW CONTROLLER ===== */
    main { position: relative; z-index: 10; padding-top: calc(var(--header-height) + 60px); padding-bottom: 120px; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 5%; width: 100%; }

    /* JS View Switching System */
    .view-container {
      display: none;
      opacity: 0;
    }
    .view-container.active {
      display: block;
      animation: viewFadeIn 0.5s ease forwards;
    }
    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SECTION 1: INTRO (Visible in Product View) ===== */
    .section-intro {
      text-align: center;
      margin-bottom: 100px;
    }
    .section-intro h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .section-intro p {
      font-size: 1.15rem;
      color: var(--c-text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* ===== SECTION 2: IBRON EXO (PRODUCT SHOT) ===== */
    .app-showcase {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 60px;
      align-items: center;
      margin-bottom: 120px;
    }

    .app-info { max-width: 560px; }
    
    .app-info h2 {
      font-size: clamp(3rem, 5vw, 4.5rem);
      line-height: 1;
      margin-bottom: 12px;
    }

    .status-line {
      font-size: 0.9rem;
      font-weight: 600;
      color: #00E676; 
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-line::before {
      content: ''; display: block; width: 6px; height: 6px;
      background: #00E676; border-radius: 50%; box-shadow: 0 0 10px #00E676;
    }

    .app-desc {
      font-size: 1.1rem;
      color: var(--c-text-muted);
      margin-bottom: 40px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 48px;
    }
    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .feature-icon {
      color: var(--c-accent);
      flex-shrink: 0;
      margin-top: 4px;
    }
    .feature-text h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #FFF;
    }
    .feature-text p {
      font-size: 0.9rem;
      color: var(--c-text-muted);
      margin: 0;
      line-height: 1.5;
    }

    /* Cinematic Phone Mockup */
    .phone-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      position: relative;
    }
    .levitation-shadow {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%) rotateX(75deg);
      width: 220px;
      height: 80px;
      background: rgba(0, 0, 0, 0.9);
      filter: blur(25px);
      z-index: 1;
    }
    .device-chassis {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 280px; 
      max-height: 68vh; 
      aspect-ratio: 9 / 19.5;
      border-radius: 36px;
      padding: 6px;
      transform: rotateY(-6deg) rotateX(4deg);
      transform-style: preserve-3d;
      background: linear-gradient(160deg, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.8) 100%);
      box-shadow: 
        -20px 30px 50px rgba(0, 0, 0, 0.7),                 
        3px -2px 20px var(--c-rim-light),                   
        -2px 4px 10px rgba(255, 255, 255, 0.05);            
    }
    .device-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 24px;
      background: #000;
      border-radius: 12px;
      z-index: 30;
    }
    .device-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 30px; 
      overflow: hidden;
      transform: translateZ(0); 
    }
    .device-screen::after {
      content: '';
      position: absolute;
      top: 0; left: -50%;
      width: 200%; height: 100%;
      background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 40%, transparent 50%);
      pointer-events: none;
      z-index: 20;
    }
    .screen-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.05);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
    }
    .screen-img.active {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== SECTION 3: IBRON CHRONOS ===== */
    .app-chronos {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      align-items: center;
      gap: 32px;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }
    .app-chronos:hover { opacity: 0.8; }
    .chronos-icon {
      width: 64px; height: 64px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: var(--c-text-muted);
      flex-shrink: 0;
    }
    .chronos-info { flex: 1; }
    .chronos-info h3 { font-size: 1.75rem; margin-bottom: 4px; color: #FFF; }
    .chronos-info p { margin: 0; color: var(--c-text-muted); font-size: 1.05rem; }
    .badge-dev {
      font-family: monospace; font-size: 0.75rem; font-weight: 600;
      color: var(--c-text-muted); border: 1px dashed rgba(255, 255, 255, 0.2);
      padding: 6px 12px; border-radius: 50px; text-transform: uppercase;
    }

    /* ==============================================================
       WIDOK: HISTORIA AKTUALIZACJI (KARTOTEKA)
       ============================================================== */
    .history-header-block {
      text-align: center;
      margin-bottom: 60px;
    }
    .history-header-block h1 {
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      margin-bottom: 12px;
    }
    .history-header-block p {
      font-size: 1.1rem;
      color: var(--c-text-muted);
    }

    .history-card {
      background: rgba(10, 10, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 16px;
      margin-bottom: 24px;
      transition: all 0.3s ease;
      overflow: hidden;
    }
    
    .history-card.current {
      border-color: rgba(232, 184, 75, 0.3);
      box-shadow: 0 8px 32px rgba(232, 184, 75, 0.05);
      background: rgba(20, 18, 15, 0.7);
    }

    .history-header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .history-header-left {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .history-version {
      font-size: 1.75rem;
      font-weight: 800;
      color: #FFF;
      margin: 0;
    }

    .history-badge {
      font-size: 0.7rem;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-current { 
      background: rgba(232, 184, 75, 0.15); 
      color: var(--c-accent); 
      border: 1px solid rgba(232, 184, 75, 0.3); 
    }
    .badge-launch { 
      background: rgba(255, 255, 255, 0.05); 
      color: var(--c-text-muted); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
    }

    .history-meta {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--c-text-muted);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .chevron {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      color: var(--c-text-muted);
    }
    .history-card:hover .chevron { color: #FFF; }
    .history-card.expanded .chevron { transform: rotate(180deg); }

    /* CSS Accordion trick using Grid */
    .history-content-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .history-card.expanded .history-content-wrapper {
      grid-template-rows: 1fr;
    }
    .history-content {
      overflow: hidden;
    }
    .history-content-inner {
      padding: 0 32px 32px 32px;
      border-top: 1px dashed rgba(255,255,255,0.1);
      margin: 0 32px; /* Margins to align border with text */
      margin-top: 16px;
      padding-top: 24px;
    }

    .history-desc {
      font-size: 1rem;
      color: var(--c-text-main);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .history-list {
      list-style: none;
    }
    .history-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 12px;
      color: var(--c-text-muted);
      font-size: 0.95rem;
    }
    .history-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--c-accent);
      font-weight: bold;
    }

    /* ===== ZMIANA 1: STYL DLA PODZIĘKOWANIA ===== */
    .history-thanks {
      background: rgba(232, 184, 75, 0.06);
      border: 1px dashed rgba(232, 184, 75, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .history-thanks-icon {
      color: var(--c-accent);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .history-thanks-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--c-text-main);
    }

    /* ===== ZMIANA 2: STYLE DLA WIDOKU KODU & BLOKÓW ===== */
    .code-warning-box {
      background: rgba(232, 184, 75, 0.04);
      border: 1px solid rgba(232, 184, 75, 0.25);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 40px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .code-warning-icon {
      color: var(--c-accent);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .code-warning-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--c-text-muted);
    }
    .code-block-container {
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 32px;
    }
    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
    }
    .code-block-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #FFF;
    }
    .code-block-desc {
      font-size: 0.95rem;
      color: var(--c-text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .code-block-pre {
      background: #050505;
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.9rem;
      color: #A3E635; /* Lekko zielonkawy monospace text */
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .btn-copy {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--c-text-muted);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0
